openapi: 3.1.0
info:
  title: Bark & Meow — API
  version: 1.0.0
  description: |-
    Contrato de apps/api: lo consumen el portal del dueño (mi-mascota), la app, la web de la clínica, la web del veterinario, el panel del operador y el software de gestión.

    Dos principios que cualquier implementación debe respetar:

    1. **El servidor no descifra.** Todo lo que lleva contenido clínico viaja como bytes opacos en base64.
    2. **Localizar no es abrir.** La consulta por identificador responde si existe ficha y nada más, con el mismo tamaño y el mismo tiempo en ambos casos.

    La consulta entre nodos (`/federation/v1/lookup`) está por implementar: solo podrá decir si existe ficha y ofrecer un enlace de aviso, con peticiones y respuestas firmadas con Ed25519.

    Generado desde packages/schema/src/api. No se edita a mano.
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
servers:
  - url: https://barkandmeow.app/api
    description: Producción
  - url: http://127.0.0.1:4601
    description: Desarrollo
paths:
  /owners/v1/register:
    post:
      tags:
        - Dueño (portal y app)
      summary: "Alta: cuenta, primera mascota pendiente y código de entrada al correo."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  type: string
                  minLength: 12
                  maxLength: 200
                pubKey:
                  type: string
                  pattern: ^[A-Za-z0-9+/]+={0,2}$
                recuperacionPub:
                  type: string
                  pattern: ^[A-Za-z0-9+/]+={0,2}$
                mascota:
                  type: object
                  properties:
                    identificador:
                      oneOf:
                        - type: object
                          properties:
                            tipo:
                              type: string
                              const: iso
                            valor:
                              type: string
                              pattern: ^\d{15}$
                          required:
                            - tipo
                            - valor
                        - type: object
                          properties:
                            tipo:
                              type: string
                              const: nonISO
                            valor:
                              type: string
                              pattern: ^nonISO:[0-9A-F]{9,10}$
                          required:
                            - tipo
                            - valor
                        - type: object
                          properties:
                            tipo:
                              type: string
                              const: ring
                            valor:
                              type: string
                              minLength: 3
                              maxLength: 32
                          required:
                            - tipo
                            - valor
                        - type: object
                          properties:
                            tipo:
                              type: string
                              const: tattoo
                            valor:
                              type: string
                              minLength: 3
                              maxLength: 32
                            ubicacion:
                              type: string
                              maxLength: 64
                          required:
                            - tipo
                            - valor
                    nombre:
                      default: ""
                      type: string
                      maxLength: 60
                  required:
                    - identificador
              required:
                - email
                - password
                - pubKey
                - mascota
      responses:
        "201":
          description: Correcto
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  token:
                    type: string
                  correo:
                    type: string
                  mascota:
                    type: object
                    properties:
                      codigoActivacion:
                        type: string
                      caduca:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                      petId:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    required:
                      - codigoActivacion
                      - caduca
                      - petId
                    additionalProperties: false
                required:
                  - correo
                  - mascota
                additionalProperties: false
        "400":
          description: Error 400
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error 409
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-acceso: publica
  /owners/v1/login:
    post:
      tags:
        - Dueño (portal y app)
      summary: "Entrar, primer paso: chip y contraseña. Envía el código de entrada."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                identificador:
                  oneOf:
                    - type: object
                      properties:
                        tipo:
                          type: string
                          const: iso
                        valor:
                          type: string
                          pattern: ^\d{15}$
                      required:
                        - tipo
                        - valor
                    - type: object
                      properties:
                        tipo:
                          type: string
                          const: nonISO
                        valor:
                          type: string
                          pattern: ^nonISO:[0-9A-F]{9,10}$
                      required:
                        - tipo
                        - valor
                    - type: object
                      properties:
                        tipo:
                          type: string
                          const: ring
                        valor:
                          type: string
                          minLength: 3
                          maxLength: 32
                      required:
                        - tipo
                        - valor
                    - type: object
                      properties:
                        tipo:
                          type: string
                          const: tattoo
                        valor:
                          type: string
                          minLength: 3
                          maxLength: 32
                        ubicacion:
                          type: string
                          maxLength: 64
                      required:
                        - tipo
                        - valor
                password:
                  type: string
                  minLength: 1
                  maxLength: 200
              required:
                - identificador
                - password
      responses:
        "200":
          description: Correcto
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  enviado:
                    type: boolean
                    const: true
                  canal:
                    type: string
                    enum:
                      - correo
                      - sms
                  correo:
                    type: string
                  otroCanal:
                    anyOf:
                      - type: string
                        enum:
                          - correo
                          - sms
                      - type: "null"
                  token:
                    type: string
                required:
                  - enviado
                  - canal
                  - correo
                  - otroCanal
                additionalProperties: false
        "400":
          description: Error 400
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error 401
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Error 502
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-acceso: publica
  /owners/v1/login/verify:
    post:
      tags:
        - Dueño (portal y app)
      summary: "Entrar, segundo paso (y confirmación del alta): el código del correo o del SMS."
      security: &a1
        - sesionDueno: []
        - tokenApp: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                codigo:
                  type: string
                  maxLength: 20
              required:
                - codigo
      responses:
        "200":
          description: Correcto
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  token:
                    type: string
                required:
                  - ok
                additionalProperties: false
        "400":
          description: Error 400
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Error 410
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Error 429
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-acceso: dueno-pendiente
  /owners/v1/login/resend:
    post:
      tags:
        - Dueño (portal y app)
      summary: Otro código para la sesión pendiente, uno por minuto, por el canal pedido.
      security: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              default: {}
              type: object
              properties:
                canal:
                  type: string
                  enum:
                    - correo
                    - sms
      responses:
        "202":
          description: Correcto
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  enviado:
                    type: boolean
                    const: true
                  canal:
                    type: string
                    enum:
                      - correo
                      - sms
                  correo:
                    type: string
                  otroCanal:
                    anyOf:
                      - type: string
                        enum:
                          - correo
                          - sms
                      - type: "null"
                  token:
                    type: string
                required:
                  - enviado
                  - canal
                  - correo
                  - otroCanal
                additionalProperties: false
        "400":
          description: Error 400
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Error 410
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Error 429
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Error 502
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-acceso: dueno-pendiente
  /owners/v1/logout:
    post:
      tags:
        - Dueño (portal y app)
      summary: Cierra la sesión. No falla si ya no había.
      security: &a2
        - sesionDueno: []
        - tokenApp: []
      responses:
        "200":
          description: Correcto
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                required:
                  - ok
                additionalProperties: false
      x-acceso: dueno
  /owners/v1/me:
    get:
      tags:
        - Dueño (portal y app)
      summary: "El dueño: sus mascotas, su perfil público, sus reclamaciones y su segundo factor."
      security: *a2
      responses:
        "200":
          description: Correcto
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  correo:
                    type: string
                  pubKey:
                    type: string
                    pattern: ^[A-Za-z0-9+/]+={0,2}$
                  recuperacion:
                    type: boolean
                  segundoFactor:
                    type: string
                    enum:
                      - correo
                      - sms
                  telefono:
                    anyOf:
                      - type: object
                        properties:
                          numero:
                            type: string
                          verificado:
                            type: boolean
                        required:
                          - numero
                          - verificado
                        additionalProperties: false
                      - type: "null"
                  mascotas:
                    type: array
                    items:
                      type: object
                      properties:
                        petId:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        estado:
                          type: string
                          enum:
                            - pendiente
                            - activa
                            - congelada
                            - retirada
                        chipPista:
                          type:
                            - string
                            - "null"
                        activada:
                          anyOf:
                            - type: string
                              format: date-time
                              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                            - type: "null"
                        mensajes:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        perfil:
                          type: object
                          properties:
                            nombre:
                              type: string
                            bio:
                              type: string
                            telefonos:
                              type: array
                              items:
                                type: object
                                properties:
                                  etiqueta:
                                    type: string
                                  numero:
                                    type: string
                                required:
                                  - etiqueta
                                  - numero
                                additionalProperties: false
                            publicado:
                              type: boolean
                            foto:
                              type:
                                - string
                                - "null"
                          required:
                            - nombre
                            - bio
                            - telefonos
                            - publicado
                            - foto
                          additionalProperties: false
                        reclamacion:
                          anyOf:
                            - type: object
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                                plazo:
                                  type: string
                                  format: date-time
                                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                                estado:
                                  type: string
                                  enum:
                                    - abierta
                                    - impugnada
                                rol:
                                  type: string
                                  enum:
                                    - titular
                                    - reclamante
                              required:
                                - id
                                - plazo
                                - estado
                                - rol
                              additionalProperties: false
                            - type: "null"
                      required:
                        - petId
                        - estado
                        - chipPista
                        - activada
                        - mensajes
                        - perfil
                        - reclamacion
                      additionalProperties: false
                required:
                  - correo
                  - pubKey
                  - recuperacion
                  - segundoFactor
                  - telefono
                  - mascotas
                additionalProperties: false
        "401":
          description: Error 401
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-acceso: dueno
  /owners/v1/pets:
    post:
      tags:
        - Dueño (portal y app)
      summary: Otra mascota en la misma cuenta. Queda pendiente hasta que la active una clínica.
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                identificador:
                  oneOf:
                    - type: object
                      properties:
                        tipo:
                          type: string
                          const: iso
                        valor:
                          type: string
                          pattern: ^\d{15}$
                      required:
                        - tipo
                        - valor
                    - type: object
                      properties:
                        tipo:
                          type: string
                          const: nonISO
                        valor:
                          type: string
                          pattern: ^nonISO:[0-9A-F]{9,10}$
                      required:
                        - tipo
                        - valor
                    - type: object
                      properties:
                        tipo:
                          type: string
                          const: ring
                        valor:
                          type: string
                          minLength: 3
                          maxLength: 32
                      required:
                        - tipo
                        - valor
                    - type: object
                      properties:
                        tipo:
                          type: string
                          const: tattoo
                        valor:
                          type: string
                          minLength: 3
                          maxLength: 32
                        ubicacion:
                          type: string
                          maxLength: 64
                      required:
                        - tipo
                        - valor
                nombre:
                  default: ""
                  type: string
                  maxLength: 60
              required:
                - identificador
      responses:
        "201":
          description: Correcto
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  codigoActivacion:
                    type: string
                  caduca:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                  petId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                required:
                  - codigoActivacion
                  - caduca
                  - petId
                additionalProperties: false
        "400":
          description: Error 400
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error 401
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-acceso: dueno
  /owners/v1/pets/{id}/activation-code:
    post:
      tags:
        - Dueño (portal y app)
      summary: "Nuevo código de activación: se muestra una vez y el anterior deja de valer."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security: *a2
      responses:
        "200":
          description: Correcto
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  codigoActivacion:
                    type: string
                  caduca:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                required:
                  - codigoActivacion
                  - caduca
                additionalProperties: false
        "401":
          description: Error 401
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error 404
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error 409
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-acceso: dueno
  /owners/v1/pets/{id}/profile:
    put:
      tags:
        - Dueño (portal y app)
      summary: "Perfil público: lo que ve quien encuentre al animal, si el dueño lo publica."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                nombre:
                  type: string
                  maxLength: 60
                bio:
                  type: string
                  maxLength: 600
                telefonos:
                  maxItems: 3
                  type: array
                  items:
                    type: object
                    properties:
                      etiqueta:
                        type: string
                        maxLength: 30
                      numero:
                        type: string
                        pattern: ^\+?[0-9 ()-]{6,20}$
                    required:
                      - etiqueta
                      - numero
                publicado:
                  type: boolean
              required:
                - nombre
                - bio
                - telefonos
                - publicado
      responses:
        "200":
          description: Correcto
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                required:
                  - ok
                additionalProperties: false
        "400":
          description: Error 400
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error 401
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error 404
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-acceso: dueno
  /owners/v1/pets/{id}/photo:
    put:
      tags:
        - Dueño (portal y app)
      summary: "Foto del perfil: JPEG, PNG o WebP de hasta 2 MB. Cada foto nueva tiene URL nueva."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security: *a2
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Correcto
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  foto:
                    type: string
                required:
                  - foto
                additionalProperties: false
        "401":
          description: Error 401
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error 404
          content:
            application/json:
              schema:
