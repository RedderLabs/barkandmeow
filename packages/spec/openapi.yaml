                              additionalProperties: false
                          foto:
                            type:
                              - string
                              - "null"
                        required:
                          - nombre
                          - bio
                          - telefonos
                          - foto
                        additionalProperties: false
                      - type: "null"
                  pad:
                    type: string
                required:
                  - existe
