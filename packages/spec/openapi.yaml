    post:
      tags:
        - "Nivel 0: localizar"
      summary: ¿Existe ficha para este identificador? La respuesta se rellena siempre al mismo tamaño (4096 bytes) y gasta el mismo presupuesto de tiempo exista o no; sin ficha, requestId, sas, aviso y ownerPubKey son señuelos con la forma correcta. Con sesión de clínica verificada y vetPubKey, abre de paso la petición de alta de nivel 3 y devuelve el número de comparación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                identificador:
                  oneOf:
                    - type: object
                      properties:
                        tipo:
                          type: string
                          const: iso
                        valor:
                          type: string
                          pattern: ^\d{15}$
                      required:
                        - tipo
                        - valor
                    - type: object
                      properties:
                        tipo:
                          type: string
                          const: nonISO
                        valor:
                          type: string
                          pattern: ^nonISO:[0-9A-F]{9,10}$
                      required:
                        - tipo
                        - valor
                    - type: object
                      properties:
                        tipo:
                          type: string
                          const: ring
                        valor:
                          type: string
                          minLength: 3
                          maxLength: 32
                      required:
                        - tipo
                        - valor
                    - type: object
                      properties:
                        tipo:
                          type: string
                          const: tattoo
                        valor:
                          type: string
                          minLength: 3
                          maxLength: 32
                        ubicacion:
                          type: string
                          maxLength: 64
                      required:
                        - tipo
                        - valor
                vetPubKey:
                  type: string
                  pattern: ^[A-Za-z0-9+/]+={0,2}$
              required:
                - identificador
      responses:
        "200":
          description: Correcto
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  existe:
                    type: boolean
                  origen:
                    type: object
                    properties:
                      clase:
                        type: string
                        enum:
                          - pais
                          - fabricante
                          - desconocido
                          - no-iso
                      codigo:
                        type: string
                      iso2:
                        type:
                          - string
                          - "null"
                    required:
                      - clase
                      - codigo
                      - iso2
                    additionalProperties: false
                  requestId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  sas:
                    type: string
                    pattern: ^\d{6}$
                  aviso:
                    type: string
                  ownerPubKey:
                    type: string
                    pattern: ^[A-Za-z0-9+/]+={0,2}$
