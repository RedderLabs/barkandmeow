  /ops/v1/claims/{id}/resolve:
    post:
      tags:
        - Operador
      summary: Resolver a mano, con una nota que queda guardada y avisa a las dos partes. Una abierta en plazo no se adelanta.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security: *a5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                aFavor:
                  type: string
                  enum:
                    - reclamante
                    - titular
                nota:
                  type: string
                  minLength: 5
                  maxLength: 2000
              required:
                - aFavor
                - nota
      responses:
        "200":
          description: Correcto
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  estado:
                    type: string
                    enum:
                      - a-favor-reclamante
                      - a-favor-titular
                required:
                  - ok
                  - estado
                additionalProperties: false
        "400":
          description: Error 400
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error 404
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error 409
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-acceso: operador
